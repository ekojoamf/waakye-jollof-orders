<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waakye & Jollof Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    p {
      margin: 0 0 20px;
      color: #555;
      font-size: 14px;
    }

    label {
      font-weight: bold;
      font-size: 13px;
      display: block;
      margin: 14px 0 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 14px;
    }

    input:focus, select:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .success {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #e9ffe9;
      border: 1px solid #7dce7d;
      color: #1f6b1f;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🍛 Waakye & Jollof Orders</h1>
    <p>Fill the form to place your order. Delivery is to your hostel room.</p>

    <form id="orderForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required placeholder="e.g. Ernest Kojo" />

      <label for="hostel">Hostel</label>
      <input type="text" id="hostel" required placeholder="e.g. Unity Hall" />

      <label for="room">Room Number</label>
      <input type="text" id="room" required placeholder="e.g. B12" />

      <label for="food">Order</label>
      <select id="food" required>
        <option value="">-- Select Food --</option>
        <option value="Waakye">Waakye</option>
        <option value="Jollof">Jollof</option>
      </select>

      <label for="amount">Amount (GH₵)</label>
      <input type="number" id="amount" required min="1" placeholder="e.g. 15" />

      <button type="submit">Place Order</button>
    </form>

    <div class="success" id="successMsg">
      ✅ Order placed successfully! Screenshot this page for confirmation.
    </div>
  </div>

  <script>
    const form = document.getElementById("orderForm");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const orderData = {
        name: document.getElementById("name").value.trim(),
        hostel: document.getElementById("hostel").value.trim(),
        room: document.getElementById("room").value.trim(),
        food: document.getElementById("food").value,
        amount: document.getElementById("amount").value
      };

      console.log("New Order:", orderData);

      // For now, it only shows success and logs the order.
      // Next step: send it to Google Sheets or a database.

      successMsg.style.display = "block";
      form.reset();
    });
  </script>
</body>
</html>
